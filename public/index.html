<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071018">
<title>JOIN TELEGRAM</title>

<style>
:root{
  --bg:#071018;
  --bg2:#0c1724;
  --card:#0f1c2a;
  --line:rgba(124,247,199,.16);
  --text:#eef6ff;
  --muted:rgba(238,246,255,.66);
  --accent:#7cf7c7;
  --accent2:#ffb347;
  --shadow:0 16px 60px rgba(0,0,0,.28);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:
    radial-gradient(circle at top, rgba(124,247,199,.16), transparent 30%),
    radial-gradient(circle at 80% 20%, rgba(255,179,71,.12), transparent 24%),
    linear-gradient(180deg,var(--bg) 0%, #050b11 100%);
  color:var(--text);
}

.wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.card{
  width:100%;
  max-width:420px;
  background:linear-gradient(180deg, rgba(15,28,42,.96), rgba(10,18,28,.96));
  border:1px solid var(--line);
  border-radius:24px;
  padding:22px 18px 18px;
  box-shadow:var(--shadow);
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  color:var(--accent);
  letter-spacing:.14em;
  text-transform:uppercase;
  font-weight:700;
}

.badge::before{
  content:"";
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 18px rgba(124,247,199,.8);
}

h1{
  font-size:30px;
  line-height:1.05;
  margin-top:14px;
  letter-spacing:-.03em;
}

p{
  margin-top:10px;
  color:var(--muted);
  line-height:1.6;
  font-size:15px;
}

.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  margin-top:18px;
  min-height:58px;
  border-radius:16px;
  text-decoration:none;
  color:#08111a;
  background:linear-gradient(135deg,var(--accent) 0%, #b8ffe7 48%, var(--accent2) 100%);
  font-weight:900;
  letter-spacing:.12em;
  text-transform:uppercase;
  box-shadow:0 14px 34px rgba(124,247,199,.18);
  border:none;
  touch-action:manipulation;
  cursor:pointer;
  transition: transform 0.08s ease-out, box-shadow 0.12s ease;
}

.btn:active{transform:scale(.99); box-shadow:0 6px 18px rgba(124,247,199,.24);}

/* subtle popup message styling */
.toast-msg {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) scale(0.96);
  background: #0f1c2a;
  backdrop-filter: blur(10px);
  border: 1px solid var(--accent);
  border-radius: 60px;
  padding: 10px 20px;
  font-size: 13px;
  font-weight: 500;
  color: var(--accent);
  white-space: nowrap;
  z-index: 999;
  opacity: 0;
  transition: opacity 0.2s ease, transform 0.2s ease;
  pointer-events: none;
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}
.toast-msg.show {
  opacity: 1;
  transform: translateX(-50%) scale(1);
}
</style>
</head>
<body>
<div class="wrap">
  <main class="card">
    <div class="badge">LIVE</div>
    <h1>JOIN TELEGRAM</h1>
    <p>JOIN TELEGRAM FOR LIVE SURESHOT</p>

    <!-- The button now links directly to your invite link -->
    <a
      class="btn"
      href="https://t.me/+_D6L0vy-SAIwNjZl"
      id="joinBtn"
      target="_blank"
      rel="noopener"
    >JOIN TELEGRAM</a>

    <div id="redirectToast" class="toast-msg">↻ redirecting...</div>
  </main>
</div>

<script>
  // Capture fbclid for Meta tracking (if you use UTM/FB ads)
  const params = new URLSearchParams(window.location.search);
  const fbclid = params.get('fbclid');
  if (fbclid) {
    localStorage.setItem('fbclid', fbclid);
  }

  const joinBtn = document.getElementById('joinBtn');
  const toast = document.getElementById('redirectToast');

  // Show the toast when clicked
  joinBtn.addEventListener('click', () => {
    toast.classList.add('show');
    setTimeout(() => {
      toast.classList.remove('show');
    }, 2000);
  });
</script>

</body>
</html>
